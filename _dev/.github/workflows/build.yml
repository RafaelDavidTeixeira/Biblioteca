name: Build Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask werkzeug pyinstaller Pillow python-barcode qrcode

      - name: Build EXE
        run: .\build_windows.bat
        shell: cmd

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Windows
          path: release/Biblioteca.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask werkzeug pyinstaller

      - name: Build Linux Binary
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-Linux
          path: release/biblioteca
          retention-days: 30
