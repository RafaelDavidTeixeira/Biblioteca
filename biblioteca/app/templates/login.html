<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#e07a5f;--bg:#f8f7f4;--sidebar:#1a1a2e;--border:#e8e6e1;--text:#2d2d2d;--muted:#6b6b6b;--success:#4a9e6b;--danger:#c0392b;--radius:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--sidebar);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#fff;border-radius:20px;padding:48px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.brand{text-align:center;margin-bottom:36px;}
.brand-icon{width:60px;height:60px;background:var(--accent);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
.brand h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--text);}
.brand p{font-size:0.82rem;color:var(--muted);margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-group input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color .2s;}
.form-group input:focus{border-color:var(--accent);}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px;transition:all .2s;}
.btn:hover{background:#c96a50;transform:translateY(-1px);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.error{background:#fde8e8;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:0.82rem;margin-bottom:16px;}
.divider{border:none;border-top:1px solid var(--border);margin:28px 0;}
/* License panel */
.lic-section{margin-top:4px;}
.lic-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0;}
.lic-header span{font-size:0.78rem;color:var(--muted);font-weight:500;}
.lic-header .lic-status{font-size:0.72rem;padding:3px 8px;border-radius:10px;font-weight:600;}
.lic-status.valid{background:#e8fdf0;color:var(--success);}
.lic-status.invalid{background:#fde8e8;color:var(--danger);}
.lic-body{margin-top:14px;display:none;}
.lic-body.open{display:block;}
.machine-id{font-size:0.72rem;color:var(--muted);background:var(--bg);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-family:monospace;}
.lic-input-row{display:flex;gap:8px;}
.lic-input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:monospace;font-size:.9rem;text-align:center;letter-spacing:1px;font-weight:600;outline:none;}
.lic-input:focus{border-color:var(--accent);}
.btn-lic{padding:10px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.lic-msg{font-size:.75rem;margin-top:8px;font-weight:500;}
.lic-msg.ok{color:var(--success);}
.lic-msg.err{color:var(--danger);}
.lic-details{margin-top:10px;font-size:.75rem;color:var(--muted);background:var(--bg);padding:10px 14px;border-radius:8px;}
.lic-details div{margin-bottom:2px;}
.lic-details strong{color:var(--text);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">B</div>
    <h1>Biblioteca</h1>
    <p>Sistema de Controle de Acervo</p>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <div class="form-group">
    <label>Usuário ou E-mail</label>
    <input type="text" id="email" placeholder="seu@email.com ou seu nome" autofocus>
  </div>
  <div class="form-group">
    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  <button class="btn" id="btn-login" onclick="doLogin()">Entrar</button>

  <hr class="divider">

  <!-- License section -->
  <div class="lic-section">
    <div class="lic-header" onclick="toggleLic()">
      <span>🔐 Licença do Sistema</span>
      <span class="lic-status {% if license_ok %}valid{% else %}invalid{% endif %}">
        {% if license_ok %}Ativa{% else %}Inativa{% endif %}
      </span>
    </div>
    <div class="lic-body" id="lic-body">
      <div class="machine-id">ID da Máquina: <strong>{{ machine_id }}</strong></div>
      <div class="lic-input-row">
        <input type="text" class="lic-input" id="lic-key" placeholder="Cole a chave de licença aqui" maxlength="200">
        <button class="btn-lic" onclick="activateLicense()">Ativar</button>
      </div>
      <div class="lic-msg" id="lic-msg"></div>
      <div class="lic-details" id="lic-details" style="display:{% if license_ok %}block{% else %}none{% endif %}">
        <div>Informe o ID da Máquina ao administrador para obter sua chave de ativação.</div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  const identifier = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({identifier, password})
    });
    const d = await r.json();
    if (d.ok) {
      window.location.href = '/dashboard';
    } else {
      showLoginError(d.error || 'Erro ao entrar');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch(e) {
    showLoginError('Erro de conexão');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function showLoginError(msg) {
  let el = document.querySelector('.error');
  if (!el) {
    el = document.createElement('div');
    el.className = 'error';
    document.querySelector('.form-group').before(el);
  }
  el.textContent = msg;
}

function toggleLic() {
  document.getElementById('lic-body').classList.toggle('open');
}

document.getElementById('lic-key').addEventListener('input', function(e) {
  let val = e.target.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  let parts = val.match(/.{1,5}/g) || [];
  e.target.value = parts.join('-').substring(0,29);
});

async function activateLicense() {
  const key = document.getElementById('lic-key').value.trim();
  const msg = document.getElementById('lic-msg');
  if (key.length < 10) { msg.className='lic-msg err'; msg.textContent='Chave muito curta.'; return; }
  msg.className='lic-msg'; msg.textContent='Verificando...';
  try {
    const r = await fetch('/api/license/activate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key})
    });
    const d = await r.json();
    if (d.ok) {
      msg.className='lic-msg ok';
      msg.textContent=`✓ Ativada! Instituição: ${d.institution} | Válida até: ${d.valid_until}`;
      document.getElementById('lic-details').style.display='block';
      document.querySelector('.lic-status').className='lic-status valid';
      document.querySelector('.lic-status').textContent='Ativa';
    } else {
      msg.className='lic-msg err';
      msg.textContent='✗ ' + d.error;
    }
  } catch(e) {
    msg.className='lic-msg err'; msg.textContent='Erro de conexão';
  }
}
</script>
</body>
</html>
